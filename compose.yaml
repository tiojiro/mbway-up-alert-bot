services:
  mbway-up-alert-bot:
    build: .
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Defina o token do bot nas variáveis da Stack}
      TELEGRAM_CHAT_ID: "-5129673264"
      PREMIOS_HORARIO: ${PREMIOS_HORARIO:-06:00}
      PREMIOS_TIMEZONE: ${PREMIOS_TIMEZONE:-Europe/Lisbon}
      PREMIOS_FILE: /data/premios.txt
    volumes:
      - /home/umbrel/umbrel/app-data/portainer/data/mbway_up_premios:/data:ro
